<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>StandReminder — time to stand up</title>
  <desc>A standing person and an upward arrow on a deep teal rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16847F"/>
      <stop offset="1" stop-color="#075451"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#background)"/>
  <!-- Upright figure with relaxed arms and two grounded legs. -->
  <circle cx="426" cy="292" r="66" fill="#FFFFFF"/>
  <path d="M320 538V453C320 416 350 396 387 396H465C502 396 532 416 532 453V538"
        stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M393 426V574L378 747M459 426V574L474 747"
